# Vorlage: Parameter einer Gegenstelle für den Integrationstest (docs/08_Interop.md).
# Werte aus der Interoperabilitätsliste der Gegenstelle übernehmen. Eingetragen
# sind die Normwerte; auskommentierte Zeilen nur bei Bedarf einschalten.
# Zeiten in Sekunden. Relative Dateinamen gelten ab dem Ordner dieser Datei.
#
# Verwendung: iec104_selftest_client --config gegenstelle.conf --foreign ...
#             iec104_selftest_server --config gegenstelle.conf ...
#             iec104_config_load("gegenstelle.conf", &cfg, &zeile)

# --- Verbindung --------------------------------------------------------------
host = 127.0.0.1            # Client: Adresse der Gegenstelle; Server: eigene Adresse
port = 2404                 # mit TLS üblich 19998

# --- Timer und Fenster ----------------------------------------------------------
t0 = 30                     # Verbindungsaufbau (mit TLS inkl. Handshake)
t1 = 15                     # Quittung gesendeter Rahmen
t2 = 10                     # spätestens eigene Quittung (< t1)
t3 = 20                     # Testrahmen nach Ruhe
k = 12                      # unquittierte gesendete I-Rahmen
w = 8                       # Quittung nach w empfangenen I-Rahmen (<= 2/3 k)
tolerant = no               # yes: bekannte Abweichungen zulassen (z. B. t3 = 0)

# --- ASDU-Profil --------------------------------------------------------------
cot_length = 2
ca_length = 2
ioa_length = 3
max_asdu_length = 249
originator = 0

# --- Server (gesteuerte Station) ---------------------------------------------
send_end_of_init = yes      # Typ 70 nach dem ersten STARTDT
command_termination = yes   # ACTTERM nach ausgeführtem Befehl
cause_of_init = 0
max_command_delay = 0       # Befehle mit Zeitmarke älter als n s verwerfen, 0 = aus
event_buffer_size = 1000
overflow = drop_oldest      # oder reject
# group = 192.0.2.10, 192.0.2.11   # Redundanzgruppe: Adressen der Leitstelle, je Zeile eine Gruppe

# --- Client (Leitstelle) ------------------------------------------------------
confirmation_timeout = 10   # ACTCON eines Befehls
termination_timeout = 10    # ACTTERM eines Befehls
expect_termination = yes    # no, wenn die Gegenstelle kein ACTTERM sendet

# --- TLS (IEC 62351-3) -------------------------------------------------------
tls = no
# tls_ca = pki/ca.pem
# tls_certificate = pki/eigenes.pem
# tls_key = pki/eigenes.key
# tls_key_password =
# tls_crl = pki/crl.pem
# tls_peer_name = gegenstelle.example     # Name oder Adresse im Zertifikat der Gegenstelle
# tls_peer_fingerprint =                  # SHA-256, alternativ zum Namen
# tls_min_version = 1.2
# tls_max_version = 1.3
# tls_renegotiation = yes
# tls_renewal_interval = 0                # eigene Schlüsselerneuerung alle n s, 0 = aus
